[project]
name = "image-to-ppt"
version = "0.1.0"
description = "將 PDF 頁面或圖片轉換成 16:9 PowerPoint 投影片"
readme = "README.md"
authors = [
    { name = "Silent", email = "joe25142021@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "customtkinter>=6.0.0",
    "pillow>=13.0.0",
    "pymupdf>=1.28.2",
    "python-pptx>=1.0.2",
    "tkinterdnd2>=0.6.4",
]

[project.scripts]
image-to-ppt = "image_to_ppt:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
]
